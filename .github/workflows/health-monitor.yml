name: Health monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    if: github.repository == 'Chucotka/Viral-Maker-AI-'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check public health endpoint
        env:
          HEALTH_CHECK_URL: https://app.innoko.ru
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          OWNER_TELEGRAM_ID: ${{ secrets.OWNER_TELEGRAM_ID }}
          OWNER_TELEGRAM_IDS: ${{ secrets.OWNER_TELEGRAM_IDS }}
        run: node scripts/health-monitor.js
