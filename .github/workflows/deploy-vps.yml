name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'cursor/guest-telegram-link-e202'
  push:
    branches:
      - cursor/guest-telegram-link-e202
      - cursor/product-hardening-e202
      - cursor/fix-app-launch-e202

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'Chucotka/Viral-Maker-AI-'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            export APP_DIR=/var/www/viral-maker
            export BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
            cd "$APP_DIR"
            git fetch origin
            git checkout "$BRANCH"
            git pull --ff-only origin "$BRANCH"
            npm ci --silent
            pm2 restart viral-maker
            sleep 2
            curl -sf http://127.0.0.1:3001/api/ping | grep -q pong
