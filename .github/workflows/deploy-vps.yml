name: Deploy VPS

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'cursor/product-radar-landing-e202'
  push:
    branches:
      - cursor/product-radar-landing-e202
      - cursor/studio-attachments-e202
      - cursor/fix-generate-500-e202
      - cursor/guest-onboarding-p1-e202
      - cursor/production-hardening-e202
      - cursor/referral-e2e-e202
      - cursor/product-hardening-e202
      - viral-maker-ai-mvp-8729039758261129816

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'Chucotka/Viral-Maker-AI-'
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            export APP_DIR=/var/www/viral-maker
            export BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
            cd "$APP_DIR"
            bash scripts/deploy-vps-update.sh
