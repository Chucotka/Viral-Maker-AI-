# viral-maker.ru — только HTTP (bootstrap до certbot)
server {
    listen 80;
    server_name viral-maker.ru www.viral-maker.ru app.viral-maker.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
