# innoko.ru + app.innoko.ru — финальный конфиг после certbot
server {
    listen 80;
    server_name innoko.ru www.innoko.ru app.innoko.ru;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name innoko.ru www.innoko.ru app.innoko.ru;

    ssl_certificate /etc/letsencrypt/live/innoko.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/innoko.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/innoko-locations.conf;
}
