# viral-maker.ru — HTTPS (после certbot в setup-viral-maker-domain.sh)
server {
    listen 443 ssl;
    server_name viral-maker.ru www.viral-maker.ru app.viral-maker.ru;

    ssl_certificate /etc/letsencrypt/live/viral-maker.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/viral-maker.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/innoko-locations.conf;
}
