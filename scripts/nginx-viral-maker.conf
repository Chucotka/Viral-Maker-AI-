# viral-maker.ru + app.viral-maker.ru — финальный конфиг после certbot
server {
    listen 80;
    server_name viral-maker.ru www.viral-maker.ru app.viral-maker.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name viral-maker.ru www.viral-maker.ru app.viral-maker.ru;

    ssl_certificate /etc/letsencrypt/live/viral-maker.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/viral-maker.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/innoko-locations.conf;
}
