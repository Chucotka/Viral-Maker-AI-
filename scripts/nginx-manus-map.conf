# Manus backend host per marketing domain (include from http { } — /etc/nginx/conf.d/)
map $host $manus_proxy_host {
    default innokoai.manus.space;
    innoko.ru innokoai.manus.space;
    www.innoko.ru innokoai.manus.space;
    viral-maker.ru __VIRAL_MAKER_MANUS_HOST__;
    www.viral-maker.ru __VIRAL_MAKER_MANUS_HOST__;
}
