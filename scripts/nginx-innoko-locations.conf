# Общие location для innoko.ru (включается в HTTP и HTTPS server blocks)

# Прокси OAuth Telegram — oauth.telegram.org в РФ часто блокируется у пользователей
location /tg-oauth/ {
    proxy_pass https://oauth.telegram.org/;
    proxy_ssl_server_name on;
    proxy_set_header Host oauth.telegram.org;
    proxy_set_header Accept-Encoding "";
    proxy_hide_header Content-Security-Policy;
    proxy_hide_header X-Frame-Options;
    proxy_redirect https://oauth.telegram.org/ /tg-oauth/;
    proxy_redirect http://oauth.telegram.org/ /tg-oauth/;
    sub_filter_once off;
    sub_filter 'https://oauth.telegram.org' '/tg-oauth';
    sub_filter 'http://oauth.telegram.org' '/tg-oauth';
    sub_filter '//oauth.telegram.org' '/tg-oauth';
    sub_filter 'https://telegram.org/' '/tg-cdn/';
    sub_filter 'http://telegram.org/' '/tg-cdn/';
}

# Статика Telegram (CSS/JS виджета входа)
location /tg-cdn/ {
    proxy_pass https://telegram.org/;
    proxy_ssl_server_name on;
    proxy_set_header Host telegram.org;
    proxy_set_header Accept-Encoding "";
}

# Виджет открывает /auth?bot_id=… (не /tg-oauth/auth) — без этого 404 на лендинге Manus
location = /auth {
    proxy_pass https://oauth.telegram.org/auth;
    proxy_ssl_server_name on;
    proxy_set_header Host oauth.telegram.org;
    proxy_set_header Accept-Encoding "";
    proxy_redirect https://oauth.telegram.org/ /tg-oauth/;
    proxy_redirect http://oauth.telegram.org/ /tg-oauth/;
    sub_filter_once off;
    sub_filter 'https://oauth.telegram.org' '/tg-oauth';
    sub_filter 'http://oauth.telegram.org' '/tg-oauth';
    sub_filter '//oauth.telegram.org' '/tg-oauth';
    sub_filter 'https://telegram.org/' '/tg-cdn/';
    sub_filter 'http://telegram.org/' '/tg-cdn/';
    sub_filter 'href="/css/' 'href="/tg-cdn/css/';
    sub_filter 'href="/js/' 'href="/tg-cdn/js/';
}

location ^~ /auth/ {
    proxy_pass https://oauth.telegram.org/auth/;
    proxy_ssl_server_name on;
    proxy_set_header Host oauth.telegram.org;
    proxy_set_header Accept-Encoding "";
    proxy_redirect https://oauth.telegram.org/ /tg-oauth/;
    proxy_redirect http://oauth.telegram.org/ /tg-oauth/;
    sub_filter_once off;
    sub_filter 'https://oauth.telegram.org' '/tg-oauth';
    sub_filter 'http://oauth.telegram.org' '/tg-oauth';
    sub_filter '//oauth.telegram.org' '/tg-oauth';
    sub_filter 'https://telegram.org/' '/tg-cdn/';
    sub_filter 'http://telegram.org/' '/tg-cdn/';
    sub_filter 'href="/css/' 'href="/tg-cdn/css/';
    sub_filter 'href="/js/' 'href="/tg-cdn/js/';
}

location = /auth/telegram/callback {
    proxy_pass http://127.0.0.1:3001/api/auth/telegram-callback;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location /api/ {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}

location /app {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location / {
    proxy_pass https://innokoai.manus.space;
    proxy_ssl_server_name on;
    proxy_set_header Host innokoai.manus.space;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_redirect off;
}
